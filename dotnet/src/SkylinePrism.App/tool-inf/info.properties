Name = Skyline-PRISM + Differential
Version = 26.6.0
Identifier = URN:LSID:laurenfields.github.io:SkylinePrismDiff
Author = Lauren Fields (fork of MacCoss Lab Skyline-PRISM)
Organization = Fields / MacCoss Lab, UW
Provider = https://github.com/laurenfields/skyline-prism
Languages = C#
Description = PRISM (Proteomics Reference-Integrated Signal Modeling): normalization of LC-MS proteomics data exported from Skyline, with robust protein quantification via Tukey median polish and reference-anchored ComBat batch correction. Runs the PRISM pipeline on the active Skyline document (PRISM + Replicates reports) and shows interactive QC plots. Adds a "Differential Analysis" button that opens an interactive differential-abundance / enrichment explorer on the PRISM output (launched via uv; add clinical metadata there to compare groups).\
\
A fork of the MacCoss Lab Skyline-PRISM tool; installs alongside it. Requires Skyline-daily and the .NET 8.0 Desktop Runtime.
